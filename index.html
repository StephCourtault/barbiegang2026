<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbie Gang Awards 2026</title>
  <!-- Police moderne Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SortableJS pour le drag & drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #fce4ec; /* Rose pastel */
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15);
    }

    h1 {
      color: #d81b60;
      font-size: 26px;
      font-weight: 800;
      margin-top: 0;
      margin-bottom: 20px;
    }

    h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 80%;
      padding: 12px;
      border: 2px solid #f8bbd0;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
    }

    button {
      background-color: #ec407a;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(236, 64, 122, 0.3);
      transition: background 0.2s;
    }

    button:hover {
      background-color: #d81b60;
    }

    /* Liste des prénoms */
    #sortable-list {
      list-style: none;
      padding: 0;
      margin: 0 auto 20px auto;
      max-width: 400px;
      counter-reset: rank-counter; /* Initialise le compteur de position */
    }

    .draggable-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      margin-bottom: 10px;
      border-radius: 16px; /* Bords bien arrondis */
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      user-select: none;
    }

    /* Numérotation automatique (1er, 2ème...) */
    .draggable-item::before {
      counter-increment: rank-counter;
      content: counter(rank-counter) "er";
      background: rgba(255, 255, 255, 0.3);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Correctif orthographique pour les positions après le 1er */
    .draggable-item:nth-child(n+2)::before {
      content: counter(rank-counter) "ème";
    }

    /* Couleurs pastel personnalisées par position */
    .draggable-item:nth-child(1) { background-color: #ffca1b; }
    .draggable-item:nth-child(2) { background-color: #908f8f; }
    .draggable-item:nth-child(3) { background-color: #9f4327; }
    .draggable-item:nth-child(4) { background-color: #539afdcb; }
    .draggable-item:nth-child(5) { background-color: #539afdcb; }
    .draggable-item:nth-child(6) { background-color: #539afdcb; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Barbie Gang Awards 2026</h1>

    <!-- Étape 1 : Saisie du nom -->
    <div id="step-login">
      <h2>Qui es-tu ?</h2>
      <input type="text" id="voter-name" placeholder="Ton prénom...">
      <br>
      <button onclick="startQuiz()">Commencer</button>
    </div>

    <!-- Étape 2 : Question & Votes -->
    <div id="step-quiz" style="display: none;">
      <h2 id="question-title">Chargement de la question...</h2>
      <p class="subtitle">Glisse-dépose du <b>plus</b> (en haut) au <b>moins</b> (en bas).</p>
      
      <ul id="sortable-list"></ul>

      <button onclick="submitRankings()">Valider mon choix</button>
    </div>

    <!-- Étape 3 : Écran de fin -->
    <div id="step-end" style="display: none;">
      <h2>Merci d'avoir voté ! 🎉</h2>
      <p>Tes réponses pour les Barbie Gang Awards 2026 ont été enregistrées avec succès.</p>
    </div>
  </div>

  <script>
    // TES CLÉS SUPABASE
    const SUPABASE_URL = "https://kozcbpxynahyhgworfrb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvemNicHh5bmFoeWhnd29yZnJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTUxNzksImV4cCI6MjEwNDQ3MTE3OX0.TfjGdpfaoCTkaLY0fLQFtaWeWDsMrQW3k2Qe3ADEgqU"; // Remplace par ta vraie clé anon

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentVoter = "";
    let questions = [];
    let participants = [];
    let currentQuestionIndex = 0;
    let sortableInstance = null;

    async function startQuiz() {
      const nameInput = document.getElementById("voter-name").value.trim();
      if (!nameInput) {
        alert("Renseigne ton prénom pour continuer !");
        return;
      }
      currentVoter = nameInput;

      // Charger participants et questions
      const { data: partData } = await supabaseClient.from('participants').select('*');
      const { data: questData } = await supabaseClient.from('questions').select('*');

      if (!partData || !questData || questData.length === 0) {
        alert("Erreur de chargement des données. Vérifie Supabase.");
        return;
      }

      participants = partData;
      questions = questData;

      document.getElementById("step-login").style.display = "none";
      document.getElementById("step-quiz").style.display = "block";

      renderQuestion();
    }

    function renderQuestion() {
      if (currentQuestionIndex >= questions.length) {
        document.getElementById("step-quiz").style.display = "none";
        document.getElementById("step-end").style.display = "block";
        return;
      }

      document.getElementById("question-title").textContent = questions[currentQuestionIndex].title;

      const listElement = document.getElementById("sortable-list");
      listElement.innerHTML = "";

      // Mélanger les participants au départ
      let shuffled = [...participants].sort(() => Math.random() - 0.5);

      shuffled.forEach(p => {
        const li = document.createElement("li");
        li.className = "draggable-item";
        li.dataset.id = p.id;
        li.appendChild(document.createTextNode(p.name));
        listElement.appendChild(li);
      });

      if (sortableInstance) sortableInstance.destroy();

      sortableInstance = new Sortable(listElement, {
        animation: 150
      });
    }

    async function submitRankings() {
      const listItems = document.querySelectorAll("#sortable-list .draggable-item");
      const currentQuestion = questions[currentQuestionIndex];

      const votesToInsert = [];
      const totalCount = listItems.length;

      listItems.forEach((item, index) => {
        const participantId = item.dataset.id;
        const rank = index + 1;
        const points = totalCount - rank; // 1er = 5 pts, 6ème = 0 pts

        votesToInsert.push({
          voter_name: currentVoter,
          question_id: currentQuestion.id,
          participant_id: participantId,
          rank: rank,
          points: points
        });
      });

      const { error } = await supabaseClient.from('votes').insert(votesToInsert);

      if (error) {
        alert("Erreur lors de l'enregistrement : " + error.message);
        return;
      }

      currentQuestionIndex++;
      renderQuestion();
    }
  </script>
</body>
</html>
